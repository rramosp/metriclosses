[project]
name = "diffgeom"
version = "0.1.0"
description = "Differential geometry of neural network parameter and representation manifolds"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Raúl Ramos-Pollán", email = "raul.ramos@udea.edu.co" },
]
keywords = [
    "differential-geometry",
    "riemannian-geometry",
    "information-geometry",
    "natural-gradient",
    "deep-learning",
    "pytorch",
]
dependencies = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.9.0",
    "notebook>=7.6.5",
    "numpy>=2.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.0",
    "torch>=2.5.0",
]

[project.scripts]
diffgeom-build-notebooks = "diffgeom.cli:build_notebooks_main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffgeom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=/tmp/pytest-diffgeom"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]
